<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة الرئيسية</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="interface.js" defer></script>
    <script src="wallet.js" defer></script>
    <script src="store.js" defer></script>
    <script src="courses.js" defer></script>
    <!-- <script src="main.js"></script> -->
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen font-sans p-4" hidden>

    <div class="flex flex-col gap-6 w-full max-w-md">

        <div class="bg-white p-8 rounded shadow-md w-full">
            <p class="text-green-600 font-bold mb-4 text-center">تم تسجيل الدخول بنجاح</p>
            <p class="text-center text-gray-600">البريد الإلكتروني: <br><span id="user-email"
                    class="font-bold text-gray-900" dir="ltr"></span></p>
            <p class="mb-6 text-center text-gray-600 mt-2">بيانات الجدول المرتبط: <br><span id="user-extra-data"
                    class="font-bold text-blue-600"></span></p>
            <button onclick="logout()"
                class="w-full bg-red-600 text-white p-2 rounded hover:bg-red-700 cursor-pointer">تسجيل الخروج</button>
        </div>

        <!-- <div class="bg-white p-8 rounded-2xl shadow-lg text-center w-full">
            <h1 class="text-2xl font-bold mb-4">كورس البرمجة المتقدم</h1>
            <p class="text-gray-400 mb-6">تعلم بناء تطبيقات الويب باحترافية.</p>
            <div class="text-xl font-semibold mb-6">السعر: 150 ج.م</div>
            <button id="payButton"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl cursor-pointer transition">
                شراء الآن
            </button>
            <p id="errorMsg" class="text-red-400 mt-4 text-sm hidden"></p>
        </div> -->
        <div id="coursesList"></div>

        <div class="bg-white p-8 rounded-2xl shadow-lg text-center w-full">
            <h2 class="text-xl font-bold mb-2">محفظة النقاط</h2>
            <p class="text-gray-600 mb-4">رصيدك الحالي: <span id="walletBalance"
                    class="font-bold text-green-600"></span> ج.م</p>
            <input type="number" id="rechargeAmount" placeholder="أدخل المبلغ" min="1"
                class="w-full border p-2 mb-3 rounded focus:outline-none focus:ring-2 focus:ring-purple-400" dir="ltr">
            <button id="rechargeButton"
                class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-xl cursor-pointer transition">
                شحن
            </button>
            <p id="rechargeError" class="text-red-400 mt-4 text-sm hidden"></p>
        </div>

    </div>
</body>

</html>
